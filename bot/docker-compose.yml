services: 
  pgdb:
    image: postgres:14
    restart: always
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_PASSWORD=admin
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes: 
      - ./pgdata:/var/lib/postgresql/data/pgdata
  pgadmin:
      image: dpage/pgadmin4
      restart: always
      ports:
        - "5050:80"
      environment:
        - PGADMIN_DEFAULT_EMAIL=admin@admin.com
        - PGADMIN_DEFAULT_PASSWORD=admin